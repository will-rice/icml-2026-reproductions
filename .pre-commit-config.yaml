exclude: ^(?:submissions/nape/|submissions/[^/]+/evidence/inputs/upstream/)

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-json
      - id: check-yaml
      - id: end-of-file-fixer
        exclude: ^submissions/efficient-parallel-samplers-for-recurrent-depth-models/vendor/arxiv/arxiv_submission\.tex$
      - id: trailing-whitespace
        exclude: ^submissions/efficient-parallel-samplers-for-recurrent-depth-models/vendor/arxiv/arxiv_submission\.tex$
      - id: check-added-large-files
        args: [--maxkb=10240]
        exclude: ^state/repro-loop/snapshots/

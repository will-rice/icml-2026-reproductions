name: pre-commit

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Run pre-commit on all files
        run: |
          uv tool install pre-commit
          uv tool run pre-commit run --all-files --show-diff-on-failure

[project]
name = "icml-2026-reproductions"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "gradio>=6.20.0",
    "huggingface-hub>=1.24.0",
    "numpy>=2.2.0",
    "scipy>=1.15.0",
    "torch>=2.0.0",
    "pre-commit>=4.2.0",
    "pytest>=8.4.0",
]


[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "skills/icml-repro-loop/scripts"]
addopts = "--ignore=submissions"

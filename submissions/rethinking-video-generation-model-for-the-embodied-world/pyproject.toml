[project]
name = "rbench-repro"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "huggingface-hub>=1.24,<2",
  "httpx>=0.28,<1",
  "jsonschema==4.25.1",
]

[project.scripts]
rbench-repro = "rbench_repro.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["gradio~=6.0", "pre-commit>=4.2", "pytest>=8.4"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project]
name = "memorization-capacity-repro"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "gradio>=5",
  "pytest>=8",
  "torch>=2",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["memorization_repro"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "unifying-mdm-repro"
version = "0.1.0"
description = "CPU reproduction evidence for Unifying Masked Diffusion Models with Various Generation Orders"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "gradio>=4.0.0",
    "numpy>=1.24.0",
    "torch>=2.0.0",
    "pytest>=7.0.0"
]

[tool.hatch.build.targets.wheel]
packages = ["src/unifying_mdm_repro"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["src"]

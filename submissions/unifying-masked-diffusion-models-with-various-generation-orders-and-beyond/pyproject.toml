[project]
name = "unifying-mdm-repro"
version = "0.1.0"
description = "CPU reproduction evidence for Unifying Masked Diffusion Models with Various Generation Orders"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "torch",
    "pytest>=7.0.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["src"]

[project]
name = "thunderagent-repro"
version = "0.1.0"
description = "CPU-only source audit evidence for ThunderAgent ICML 2026 reproduction"
requires-python = ">=3.10"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/thunderagent_repro"]

[tool.pytest.ini_options]
pythonpath = ["src"]

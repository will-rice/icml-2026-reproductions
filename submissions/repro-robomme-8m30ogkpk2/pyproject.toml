[project]
name = "robomme-reproduction"
version = "0.1.0"
description = "CPU-only RoboMME reproduction evidence for ICML 2026 Agent Repro Challenge"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "gradio>=5.0",
    "huggingface-hub>=0.33",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[project]
name = "dimension-free-diffusion-gmm-repro"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0"]

[dependency-groups]
dev = ["pytest>=8.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/diffusion_gmm_repro"]

[tool.pytest.ini_options]
testpaths = ["tests"]

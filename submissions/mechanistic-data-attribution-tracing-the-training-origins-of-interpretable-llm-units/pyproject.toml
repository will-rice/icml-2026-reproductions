[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mechanistic-data-attribution-repro"
version = "0.1.0"
description = "Reproduction of Mechanistic Data Attribution: Tracing the Training Origins of Interpretable LLM Units (ICML 2026)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
    "numpy>=1.24.0",
    "gradio==6.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["src"]

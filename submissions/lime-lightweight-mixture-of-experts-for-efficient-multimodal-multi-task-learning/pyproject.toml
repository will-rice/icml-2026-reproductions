[project]
name = "lime-lightweight-mixture-of-experts-for-efficient-multimodal-multi-task-learning"
version = "0.1.0"
description = "Reproduction codebase for LiME: Lightweight Mixture of Experts for Efficient Multimodal Multi-task Learning"
dependencies = [
    "torch>=2.0.0",
    "numpy>=1.24.0",
    "gradio>=5.0.0",
]
readme = "README.md"
requires-python = ">=3.10"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lime_peft"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
dont_write_bytecode = true
addopts = "-p no:cacheprovider"


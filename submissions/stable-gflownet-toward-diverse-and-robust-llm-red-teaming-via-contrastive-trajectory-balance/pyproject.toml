[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "stable-gflownet-repro"
version = "0.1.0"
description = "Reproduction code for Stable-GFlowNet: Toward Diverse and Robust LLM Red-Teaming via Contrastive Trajectory Balance"
dependencies = [
    "torch",
    "numpy",
    "pytest"
]

[tool.uv]
environments = ["sys_platform == 'linux'"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agoq-repro"
version = "0.1.0"
description = "Pinned evidence audit for AGoQ"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "gradio==4.44.1",
    "huggingface-hub<1.0",
]

[dependency-groups]
dev = [
    "pytest>=7.0.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

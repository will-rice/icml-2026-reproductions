[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "reward-free-alignment"
version = "0.1.0"
description = "Reproduction package for RACO: Reward-Free Alignment for Conflicting Objectives"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
    "jsonschema>=4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "gradio>=4.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/reward_free_alignment"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[project]
name = "rex-repro"
version = "0.1.0"
description = "CPU evidence for the ICML 2026 Rex reproduction attempt"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rex_repro"]

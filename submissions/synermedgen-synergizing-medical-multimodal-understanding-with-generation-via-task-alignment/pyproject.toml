[project]
name = "synermedgen-repro"
version = "0.1.0"
description = "CPU-only artifact availability audit for SynerMedGen"
requires-python = ">=3.10"
dependencies = [
  "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/synermedgen_repro"]

[tool.pytest.ini_options]
pythonpath = ["src"]

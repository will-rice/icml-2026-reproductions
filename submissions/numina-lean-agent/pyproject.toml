[project]
name = "numina-lean-reproduction"
version = "0.1.0"
requires-python = ">=3.11"

[project.scripts]
numina-putnam-audit = "numina_lean.putnam_audit:main"
numina-brascamp-lieb-audit = "numina_lean.brascamp_lieb_audit:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/numina_lean"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

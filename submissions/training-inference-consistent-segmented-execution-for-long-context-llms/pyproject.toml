[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "training-inference-consistent-segmented-execution-for-long-context-llms"
version = "0.1.0"
description = "CPU-only evidence for segmented long-context execution"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "gradio>=6.20.0",
    "pytest>=8.0.0",
    "torch>=2.6.0",
]

[tool.uv]
package = false

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dvpd-speech-enhancement"
version = "0.1.0"
description = "Dual-View Predictive Diffusion for Lightweight Speech Enhancement"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
    "numpy>=1.24.0",
    "streamlit>=1.38.0",
    "pytest>=7.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

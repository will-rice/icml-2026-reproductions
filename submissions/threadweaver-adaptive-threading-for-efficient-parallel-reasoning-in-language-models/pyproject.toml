[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "threadweaver-repro"
version = "0.1.0"
description = "CPU-only evidence bundle for ThreadWeaver"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "streamlit",
]

[tool.setuptools]
packages = ["threadweaver_repro"]

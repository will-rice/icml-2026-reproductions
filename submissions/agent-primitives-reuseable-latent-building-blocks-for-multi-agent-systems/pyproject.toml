[project]
name = "agent-primitives-repro"
version = "0.1.0"
description = "CPU-only evidence audit for Agent Primitives"
requires-python = ">=3.10"
dependencies = [
    "gradio>=4.0.0",
    "pytest>=7.0.0",
]

[build-system]
requires = ["uv_build"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-p no:cacheprovider"

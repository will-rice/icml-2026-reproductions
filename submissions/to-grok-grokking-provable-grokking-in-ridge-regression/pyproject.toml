[project]
name = "grokking-ridge-repro"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "numpy>=2",
  "pytest>=8",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["grokking_repro"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

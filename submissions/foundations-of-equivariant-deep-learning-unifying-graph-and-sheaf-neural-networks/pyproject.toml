description = "Reproduction of Foundations of Equivariant Deep Learning: Unifying Graph and Sheaf Neural Networks"
dependencies = [
    "torch>=2.0.0",
    "numpy>=1.24.0",
    "streamlit>=1.25.0",
    "pytest>=7.0.0"
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

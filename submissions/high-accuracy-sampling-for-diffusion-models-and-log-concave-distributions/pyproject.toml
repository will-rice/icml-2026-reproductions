[project]
name = "high-accuracy-sampling-for-diffusion-models-and-log-concave-distributions"
version = "0.1.0"
description = "Reproduction of High-accuracy sampling for diffusion models and log-concave distributions"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "pytest>=7.0.0",
    "gradio>=4.0.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

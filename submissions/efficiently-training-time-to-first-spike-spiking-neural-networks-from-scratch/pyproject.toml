[project]
name = "ettfs-snn"
version = "0.1.0"
description = "Reproduction of Efficiently Training Time-to-First-Spike Spiking Neural Networks from Scratch (ICML 2026)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
    "numpy>=1.24.0",
    "pytest>=7.0.0",
    "gradio>=4.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

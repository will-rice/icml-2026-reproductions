[project]
name = "weak-diffusion-priors-reproduction"
version = "0.1.0"
description = "Reproduction package for Weak Diffusion Priors Can Still Achieve Strong Inverse-Problem Performance (ICML 2026)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "matplotlib>=3.7.0",
    "streamlit>=1.30.0",
    "pytest>=7.4.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["weak_diffusion_priors"]

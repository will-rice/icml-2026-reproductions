[project]
name = "scenesmith-reproduction"
version = "0.1.0"
description = "Evidence harness for SceneSmith ICML 2026 reproduction"
requires-python = ">=3.11"
dependencies = [
    "gradio>=5.0.0",
    "pytest>=8.4.0",
    "pyyaml>=6.0.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["generate_evidence.py", "app.py", "pages", "evidence"]

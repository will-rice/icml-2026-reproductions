[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "quarch-repro"
version = "0.1.0"
description = "Reproduction of QuArch computer architecture reasoning benchmark claims"
dependencies = [
    "pytest>=7.0.0",
    "gradio>=4.0.0"
]

[tool.pytest.ini_options]
minversion = "6.0"
testpaths = ["tests"]

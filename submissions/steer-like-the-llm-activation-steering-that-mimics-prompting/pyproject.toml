[project]
name = "steer-like-llm"
version = "0.1.0"
description = "Reproduction of Steer Like the LLM: Activation Steering that Mimics Prompting"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch",
    "numpy",
    "pytest>=7.0.0",
]

[build-system]
requires = ["uv_build"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

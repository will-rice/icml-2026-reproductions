[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "steer-like-llm"
version = "0.1.0"
description = "Reproduction of Steer Like the LLM: Activation Steering that Mimics Prompting"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch",
    "numpy",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "optimizing-rank-inr-repro"
version = "0.1.0"
description = "Reproduction of ICML 2026 paper: Optimizing Rank for High-Fidelity Implicit Neural Representations"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "torch>=2.0.0",
    "numpy>=1.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "streamlit>=1.20.0",
]

[tool.setuptools.packages.find]
where = ["src"]

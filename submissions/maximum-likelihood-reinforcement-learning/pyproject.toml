[project]
name = "maxrl-repro"
version = "0.1.0"
description = "CPU-only evidence for Maximum Likelihood Reinforcement Learning"
requires-python = ">=3.11"
dependencies = [
  "gradio>=5.0",
]

[dependency-groups]
dev = [
  "pytest>=8.0",
]

[build-system]
requires = ["uv_build>=0.9.0,<0.10.0"]
build-backend = "uv_build"

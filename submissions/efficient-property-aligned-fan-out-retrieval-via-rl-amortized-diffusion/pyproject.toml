[project]
name = "r4t-repro"
version = "0.1.0"
description = "CPU-only reproduction evidence for R4T fan-out retrieval artifact claims."
requires-python = ">=3.10"
dependencies = [
  "gradio>=5.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["uv_build>=0.11.0,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

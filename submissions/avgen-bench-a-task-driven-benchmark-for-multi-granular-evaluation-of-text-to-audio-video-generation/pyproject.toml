[project]
name = "avgen-bench-repro"
version = "0.1.0"
description = "CPU-only evidence audit for AVGen-Bench."
requires-python = ">=3.11"
dependencies = [
  "gradio>=5.0.0",
  "huggingface-hub>=0.30.0",
  "pytest>=8.0.0",
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/avgen_repro"]

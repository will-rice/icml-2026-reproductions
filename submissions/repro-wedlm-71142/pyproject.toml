[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wedlm-repro"
version = "0.1.0"
description = "CPU reproduction evidence for WeDLM causal diffusion scheduling"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "gradio>=6.20.0",
    "numpy>=1.24.0",
    "pytest>=7.0.0"
]

[tool.hatch.build.targets.wheel]
packages = ["src/wedlm_repro"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

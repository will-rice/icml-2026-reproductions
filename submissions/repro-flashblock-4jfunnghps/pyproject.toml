[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "flashblock-repro"
version = "0.1.0"
description = "Reproduction package for FlashBlock: Attention Caching for Efficient Long-Context Block Diffusion"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
    "numpy>=1.24.0",
    "pytest>=7.0.0",
]

[project.optional-dependencies]
dev = [
    "gradio>=4.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/flashblock_repro"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

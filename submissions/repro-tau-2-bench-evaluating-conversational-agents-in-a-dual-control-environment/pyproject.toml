[project]
name = "tau2-bench-repro"
version = "0.1.0"
description = "CPU-only reproduction evidence for tau2-bench telecom structural claims"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
tau2-bench-repro = "tau2_bench_repro.cli:main"

[dependency-groups]
dev = ["pytest>=8.4,<9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tau2_bench_repro"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

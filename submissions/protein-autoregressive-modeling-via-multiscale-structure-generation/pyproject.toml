[project]
name = "par-protein-repro"
version = "0.1.0"
description = "Reproduction of Protein Autoregressive Modeling via Multiscale Structure Generation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "pytest>=7.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/par_protein"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
